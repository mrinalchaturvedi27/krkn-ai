#     url: "$HOST/user/uniqueid"
#   - name: ratings
#     url: "$HOST/ratings/api/fetch/Watson"


scenario:
  pod-scenarios:
    enable: true
  application-outages:
    enable: true
  container-scenarios:
    enable: true
  node-cpu-hog:
    enable: false
  node-memory-hog:
    enable: false
  node-io-hog:
    enable: false
  time-scenarios:
    enable: false
  network-scenarios:
    enable: false
  dns-outage:
    enable: true
  syn-flood:
    enable: false
  pvc-scenarios:
    enable: false
  kubevirt-scenarios:
    enable: false

cluster_components:
  namespaces:
  - name: krkn-ps-fixture
    pods:
    - containers:
      - name: nginx
      - name: sidecar
      labels:
        app: web
        env: dev
        pod-template-hash: 65cf5fbd4f
        service: frontend
      name: web-app-65cf5fbd4f-ffc2n
      owner:
        kind: ReplicaSet
        name: web-app-65cf5fbd4f
    - containers:
      - name: nginx
      - name: sidecar
      labels:
        app: web
        env: dev
        pod-template-hash: 65cf5fbd4f
        service: frontend
      name: web-app-65cf5fbd4f-txz7f
      owner:
        kind: ReplicaSet
        name: web-app-65cf5fbd4f
    pvcs:
    - name: web-data
    services:
    - labels:
        app: web
        role: external
      name: web-lb
      ports:
      - port: 80
        target_port: 80
    - labels:
        app: web
      name: web-svc
      ports:
      - port: 80
        target_port: 80
  nodes:
  - free_cpu: -1.0
    free_mem: -1.0
    labels:
      beta.kubernetes.io/arch: arm64
      beta.kubernetes.io/os: linux
      ingress-ready: 'true'
      kubernetes.io/arch: arm64
      kubernetes.io/hostname: krkn-ps-fixture-control-plane
      kubernetes.io/os: linux
      node-role.kubernetes.io/control-plane: ''
      node.kubernetes.io/exclude-from-external-load-balancers: ''
    name: krkn-ps-fixture-control-plane
    taints:
    - node-role.kubernetes.io/control-plane:NoSchedule
  - free_cpu: -1.0
    free_mem: -1.0
    labels:
      beta.kubernetes.io/arch: arm64
      beta.kubernetes.io/os: linux
      kubernetes.io/arch: arm64
      kubernetes.io/hostname: krkn-ps-fixture-worker
      kubernetes.io/os: linux
    name: krkn-ps-fixture-worker
  - free_cpu: -1.0
    free_mem: -1.0
    labels:
      beta.kubernetes.io/arch: arm64
      beta.kubernetes.io/os: linux
      kubernetes.io/arch: arm64
      kubernetes.io/hostname: krkn-ps-fixture-worker2
      kubernetes.io/os: linux
    name: krkn-ps-fixture-worker2

adaptive_mutation:
  enable: false
  min: 0.05
  max: 0.9
  threshold: 0.1
  generations: 5

# Stopping criteria configuration
# Multiple criteria can be set - the algorithm stops when ANY criterion is met
# stopping_criteria:
#   # Stop when best fitness score reaches or exceeds this value
#   fitness_threshold: 0.95
#
#   # Stop if best fitness doesn't improve for N consecutive generations
#   generation_saturation: 10
#
#   # Stop if no new unique scenarios are discovered for N consecutive generations
#   exploration_saturation: 5
#
#   # Minimum improvement threshold for generation saturation (default: 0.0001)
#   saturation_threshold: 0.0001